<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="tiffanyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14f1d9"/>
      <stop offset="100%" stop-color="#0abab5"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="300" cy="300" r="210" fill="#f59e0b" opacity="0.12"/>
  <circle cx="300" cy="300" r="140" fill="#14f1d9" opacity="0.1"/>

  <g filter="url(#goldGlow)">
    <!-- Base Shield Card -->
    <rect x="80" y="90" width="440" height="420" rx="36" fill="#080c14" stroke="url(#goldGrad)" stroke-width="3"/>

    <!-- Top Crown / Diamond Icon -->
    <g transform="translate(200, 140)">
      <!-- Crown / Shield polygon -->
      <polygon points="100,20 160,50 140,110 60,110 40,50" fill="url(#goldGrad)"/>
      <polygon points="100,35 145,58 130,100 70,100 55,58" fill="#080c14"/>
      <polygon points="100,50 120,85 80,85" fill="url(#tiffanyGrad)"/>
      <circle cx="100" cy="18" r="8" fill="#ffffff"/>
      <circle cx="40" cy="46" r="6" fill="#ffffff"/>
      <circle cx="160" cy="46" r="6" fill="#ffffff"/>
    </g>

    <!-- Header Text -->
    <text x="300" y="295" font-family="'Orbitron', sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">VIP СПОНСОР</text>
    <text x="300" y="325" font-family="'Orbitron', sans-serif" font-size="12" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="3">ГЕНЕРАЛЬНЕ ПАРТНЕРСТВО</text>

    <!-- Checklist Pill Items inside card -->
    <g transform="translate(110, 350)">
      <rect x="0" y="0" width="380" height="34" rx="10" fill="#1e293b" opacity="0.6"/>
      <circle cx="20" cy="17" r="6" fill="#14f1d9"/>
      <text x="38" y="21" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Окремий партнерський канал у Discord сім'ї</text>

      <rect x="0" y="44" width="380" height="34" rx="10" fill="#1e293b" opacity="0.6"/>
      <circle cx="20" cy="61" r="6" fill="#fbbf24"/>
      <text x="38" y="65" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Спонсорський банер на головній сторінці сайту</text>

      <rect x="0" y="88" width="380" height="34" rx="10" fill="#1e293b" opacity="0.6"/>
      <circle cx="20" cy="105" r="6" fill="#14f1d9"/>
      <text x="38" y="109" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Унікальна золота роль «Генеральний Спонсор»</text>
    </g>
  </g>
</svg>
