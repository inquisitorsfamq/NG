<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="100%" stop-color="#2D3282"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14f1d9"/>
      <stop offset="100%" stop-color="#0abab5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="300" cy="300" r="220" fill="#5865F2" opacity="0.15" filter="url(#glow)"/>
  <circle cx="300" cy="300" r="140" fill="#14f1d9" opacity="0.12" filter="url(#glow)"/>

  <!-- Main Card Body -->
  <rect x="90" y="110" width="420" height="380" rx="36" fill="#0b1320" stroke="#5865F2" stroke-width="3"/>
  <rect x="110" y="130" width="380" height="70" rx="20" fill="url(#bgGrad)"/>

  <!-- Discord Logo on Header -->
  <path d="M205 165 C205 152 214 148 214 148 C204 145 194 148 194 148 C193 149 181 163 177 182 C190 186 202 186 202 186 C205 182 208 177 210 172 C205 170 201 168 198 165 C199 164 200 163 201 162 C223 172 247 172 269 162 C270 163 271 164 272 165 C269 168 265 170 260 172 C262 177 265 182 268 186 C268 186 280 186 293 182 C289 163 277 149 276 148 C276 148 266 145 256 148 C256 148 265 152 265 165 C265 165 252 174 235 174 C218 174 205 165 205 165 Z" fill="#ffffff" transform="translate(65, -8) scale(0.9)"/>
  <text x="330" y="174" font-family="'Orbitron', sans-serif" font-size="19" font-weight="900" fill="#ffffff" letter-spacing="1">DISCORD ADS</text>

  <!-- Big Glowing Megaphone Icon -->
  <g transform="translate(180, 230)">
    <!-- Megaphone Cone -->
    <path d="M60 70 L150 20 L150 140 L60 90 Z" fill="url(#neonCyan)"/>
    <!-- Back Body -->
    <rect x="25" y="65" width="40" height="30" rx="8" fill="#ffffff"/>
    <!-- Handle -->
    <path d="M45 95 L35 145 L60 145 L65 95 Z" fill="#334155"/>
    <!-- Sound Waves -->
    <path d="M175 40 C195 60 195 100 175 120" stroke="#14f1d9" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M195 20 C225 50 225 110 195 140" stroke="#5865F2" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Target Badge -->
  <rect x="140" y="405" width="320" height="46" rx="14" fill="#14f1d9" opacity="0.15" stroke="#14f1d9" stroke-width="1.5"/>
  <text x="300" y="434" font-family="'Orbitron', sans-serif" font-size="13" font-weight="900" fill="#14f1d9" text-anchor="middle" letter-spacing="1">PING @EVERYONE • 1000+ ОХОПЛЕННЯ</text>
</svg>
