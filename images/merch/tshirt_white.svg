<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="tshirtGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#0abab5" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- T-Shirt Body Outline -->
    <path d="M 200 90 Q 250 130 300 130 Q 350 130 400 90 L 515 155 Q 545 180 500 245 L 445 220 L 440 480 Q 440 500 420 500 L 180 500 Q 160 500 160 480 L 155 220 L 100 245 Q 55 180 85 155 Z" 
          fill="url(#tshirtGlow)" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Collar -->
    <path d="M 200 90 Q 300 150 400 90 Q 350 120 300 120 Q 250 120 200 90 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 215 95 Q 300 135 385 95" fill="none" stroke="#0abab5" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Left & Right Sleeve Creases -->
    <path d="M 155 220 L 195 240" fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.6"/>
    <path d="M 445 220 L 405 240" fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.6"/>

    <!-- Realistic Fabric Folds -->
    <path d="M 180 320 Q 230 350 200 440" fill="none" stroke="#cbd5e1" stroke-width="4" opacity="0.5"/>
    <path d="M 420 300 Q 370 360 390 450" fill="none" stroke="#cbd5e1" stroke-width="4" opacity="0.5"/>
    <path d="M 280 430 Q 320 450 350 430" fill="none" stroke="#cbd5e1" stroke-width="3" opacity="0.4"/>

    <!-- Inside Label Tag -->
    <rect x="275" y="125" width="50" height="25" rx="3" fill="#0abab5" opacity="0.9"/>
    <text x="300" y="141" font-family="'Orbitron', sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">INQ • L</text>

    <!-- Chest Print: INQUISITORS CHROME TYPOGRAPHY & EMBLEM -->
    <g transform="translate(180, 230)">
      <!-- Cyber Chrome Box -->
      <rect x="0" y="0" width="240" height="90" rx="8" fill="#070b0e" stroke="#0abab5" stroke-width="1.5" opacity="0.95"/>
      <rect x="3" y="3" width="234" height="84" rx="6" fill="none" stroke="#14f1d9" stroke-width="0.75" stroke-dasharray="8,4" opacity="0.6"/>
      
      <!-- Crosshairs icon -->
      <circle cx="25" cy="25" r="10" fill="none" stroke="#0abab5" stroke-width="1.5"/>
      <line x1="25" y1="10" x2="25" y2="40" stroke="#0abab5" stroke-width="1.5"/>
      <line x1="10" y1="25" x2="40" y2="25" stroke="#0abab5" stroke-width="1.5"/>
      
      <!-- Text -->
      <text x="120" y="38" font-family="'Orbitron', sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="3" text-anchor="middle">INQUISITORS</text>
      <text x="120" y="60" font-family="'Orbitron', sans-serif" font-size="11" font-weight="700" fill="#0abab5" letter-spacing="5" text-anchor="middle">FAMQ • OFFICIAL MERCH</text>
      
      <!-- Micro barcode -->
      <g transform="translate(45, 68)" stroke="#ffffff" stroke-width="1.5" opacity="0.7">
        <line x1="0" y1="0" x2="0" y2="12"/>
        <line x1="4" y1="0" x2="4" y2="12"/>
        <line x1="10" y1="0" x2="10" y2="12"/>
        <line x1="14" y1="0" x2="14" y2="12" stroke-width="3"/>
        <line x1="22" y1="0" x2="22" y2="12"/>
        <line x1="28" y1="0" x2="28" y2="12"/>
        <line x1="36" y1="0" x2="36" y2="12" stroke-width="2.5"/>
        <line x1="44" y1="0" x2="44" y2="12"/>
        <line x1="52" y1="0" x2="52" y2="12"/>
        <line x1="60" y1="0" x2="60" y2="12" stroke-width="3"/>
        <line x1="70" y1="0" x2="70" y2="12"/>
        <line x1="80" y1="0" x2="80" y2="12"/>
        <line x1="90" y1="0" x2="90" y2="12" stroke-width="2"/>
        <line x1="100" y1="0" x2="100" y2="12"/>
        <line x1="110" y1="0" x2="110" y2="12"/>
        <line x1="120" y1="0" x2="120" y2="12"/>
        <line x1="130" y1="0" x2="130" y2="12" stroke-width="3"/>
        <line x1="140" y1="0" x2="140" y2="12"/>
        <line x1="150" y1="0" x2="150" y2="12"/>
      </g>
    </g>

    <!-- Bottom Hem Tiffany Label -->
    <rect x="420" y="475" width="20" height="25" rx="2" fill="#0abab5"/>
    <text x="430" y="492" font-family="'Orbitron', sans-serif" font-size="8" font-weight="bold" fill="#070b0e" text-anchor="middle">IQ</text>
  </g>
</svg>