<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="tshirtBlackGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="chromeMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#14f1d9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="neonShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#0abab5" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#neonShadow)">
    <!-- T-Shirt Body Outline -->
    <path d="M 200 90 Q 250 130 300 130 Q 350 130 400 90 L 515 155 Q 545 180 500 245 L 445 220 L 440 480 Q 440 500 420 500 L 180 500 Q 160 500 160 480 L 155 220 L 100 245 Q 55 180 85 155 Z" 
          fill="url(#tshirtBlackGrad)" stroke="#334155" stroke-width="1.5"/>

    <!-- Collar -->
    <path d="M 200 90 Q 300 150 400 90 Q 350 120 300 120 Q 250 120 200 90 Z" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <path d="M 215 95 Q 300 135 385 95" fill="none" stroke="#0abab5" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Left & Right Sleeve Creases -->
    <path d="M 155 220 L 195 240" fill="none" stroke="#1e293b" stroke-width="2"/>
    <path d="M 445 220 L 405 240" fill="none" stroke="#1e293b" stroke-width="2"/>

    <!-- Realistic Fabric Folds -->
    <path d="M 180 320 Q 230 350 200 440" fill="none" stroke="#020617" stroke-width="5" opacity="0.6"/>
    <path d="M 420 300 Q 370 360 390 450" fill="none" stroke="#020617" stroke-width="5" opacity="0.6"/>

    <!-- Inside Label Tag -->
    <rect x="275" y="125" width="50" height="25" rx="3" fill="#0abab5" opacity="0.9"/>
    <text x="300" y="141" font-family="'Orbitron', sans-serif" font-size="9" font-weight="900" fill="#020617" text-anchor="middle">INQ • XL</text>

    <!-- Chest Print: CHROME GOTHIC INQUISITORS -->
    <g transform="translate(160, 220)">
      <circle cx="140" cy="50" r="45" fill="none" stroke="#0abab5" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>
      
      <!-- Chrome Gothic Typography with Glow -->
      <text x="140" y="45" font-family="'Orbitron', 'Cinzel', serif" font-size="28" font-weight="900" fill="url(#chromeMetal)" letter-spacing="4" text-anchor="middle" filter="drop-shadow(0 0 10px rgba(20,241,217,0.8))">INQUISITORS</text>
      <text x="140" y="70" font-family="'Orbitron', sans-serif" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="8" text-anchor="middle">DOMINANCE • NG 5 RP</text>
      
      <!-- Minimalist Cross / Heart symbols like family logo -->
      <path d="M 140 85 L 143 92 L 150 92 L 144 96 L 146 103 L 140 99 L 134 103 L 136 96 L 130 92 L 137 92 Z" fill="#0abab5"/>
    </g>

    <!-- Bottom Hem Tiffany Woven Label -->
    <rect x="180" y="475" width="22" height="25" rx="2" fill="#0abab5"/>
    <text x="191" y="492" font-family="'Orbitron', sans-serif" font-size="8" font-weight="bold" fill="#020617" text-anchor="middle">NG</text>
  </g>
</svg>