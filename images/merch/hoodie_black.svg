<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="hoodieBlack" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="chromeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#14f1d9"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="hoodieShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#0abab5" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <g filter="url(#hoodieShadow)">
    <!-- Hood backdrop inside -->
    <ellipse cx="300" cy="115" rx="80" ry="70" fill="#020617"/>

    <!-- Sleeves & Body -->
    <path d="M 210 90 L 110 160 Q 60 210 70 340 L 130 330 L 160 270 L 160 480 Q 160 510 180 510 L 420 510 Q 440 510 440 480 L 440 270 L 470 330 L 530 340 Q 540 210 490 160 L 390 90 Z" 
          fill="url(#hoodieBlack)" stroke="#334155" stroke-width="2"/>

    <!-- Ribbed Cuff Sleeves -->
    <path d="M 70 340 L 130 330 L 125 365 L 65 375 Z" fill="#0f172a" stroke="#0abab5" stroke-width="1.5"/>
    <path d="M 530 340 L 470 330 L 475 365 L 535 375 Z" fill="#0f172a" stroke="#0abab5" stroke-width="1.5"/>

    <!-- Ribbed Bottom Hem -->
    <rect x="160" y="480" width="280" height="30" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

    <!-- Hood Front Silhouette -->
    <path d="M 220 90 Q 200 40 300 40 Q 400 40 380 90 Q 300 130 220 90 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <path d="M 240 85 Q 300 125 360 85" fill="none" stroke="#0abab5" stroke-width="2"/>

    <!-- Drawstrings with Chrome Tips -->
    <path d="M 270 115 Q 265 190 260 250" fill="none" stroke="#e2e8f0" stroke-width="3"/>
    <rect x="257" y="250" width="6" height="18" rx="2" fill="#0abab5" stroke="#ffffff" stroke-width="1"/>
    
    <path d="M 330 115 Q 335 190 340 250" fill="none" stroke="#e2e8f0" stroke-width="3"/>
    <rect x="337" y="250" width="6" height="18" rx="2" fill="#0abab5" stroke="#ffffff" stroke-width="1"/>

    <!-- Kangaroo Pocket -->
    <path d="M 210 370 L 390 370 L 420 450 L 180 450 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <path d="M 210 370 L 180 450" stroke="#0abab5" stroke-width="1.5"/>
    <path d="M 390 370 L 420 450" stroke="#0abab5" stroke-width="1.5"/>

    <!-- Chest Huge INQUISITORS Chrome Heart Emblem -->
    <g transform="translate(180, 180)">
      <rect x="0" y="0" width="240" height="110" rx="12" fill="#070b0e" stroke="#0abab5" stroke-width="2" opacity="0.9"/>
      
      <!-- Logo Typography -->
      <text x="120" y="45" font-family="'Orbitron', sans-serif" font-size="24" font-weight="900" fill="url(#chromeGlow)" letter-spacing="4" text-anchor="middle" filter="drop-shadow(0 0 12px rgba(20,241,217,0.9))">INQUISITORS</text>
      <text x="120" y="70" font-family="'Orbitron', sans-serif" font-size="10" font-weight="800" fill="#ffffff" letter-spacing="6" text-anchor="middle">LIMITED OVERSIZE HOODIE</text>
      
      <!-- Cyan Accent Line -->
      <line x1="30" y1="85" x2="210" y2="85" stroke="#0abab5" stroke-width="2"/>
      <circle cx="120" cy="85" r="4" fill="#14f1d9"/>
    </g>
  </g>
</svg>