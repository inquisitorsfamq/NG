<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="mugBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="mugInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="mugShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#0abab5" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#mugShadow)">
    <!-- Handle -->
    <path d="M 400 230 C 510 230 510 410 400 410" fill="none" stroke="#e2e8f0" stroke-width="36" stroke-linecap="round"/>
    <path d="M 400 230 C 495 230 495 410 400 410" fill="none" stroke="#94a3b8" stroke-width="14" stroke-linecap="round" opacity="0.4"/>

    <!-- Cylinder Body -->
    <path d="M 180 180 L 180 440 C 180 480 420 480 420 440 L 420 180 Z" fill="url(#mugBody)" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Mug Rim & Inside Depth -->
    <ellipse cx="300" cy="180" rx="120" ry="35" fill="url(#mugInner)" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="300" cy="183" rx="114" ry="30" fill="#0abab5" opacity="0.35"/>

    <!-- Bottom Rim -->
    <path d="M 180 440 C 180 480 420 480 420 440" fill="none" stroke="#64748b" stroke-width="2"/>

    <!-- Inquisitors Graphic Print on Mug -->
    <g transform="translate(210, 260)">
      <rect x="0" y="0" width="180" height="90" rx="8" fill="#070b0e" stroke="#0abab5" stroke-width="2"/>
      
      <!-- Text -->
      <text x="90" y="38" font-family="'Orbitron', sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="2" text-anchor="middle">INQUISITORS</text>
      <text x="90" y="58" font-family="'Orbitron', sans-serif" font-size="9" font-weight="800" fill="#0abab5" letter-spacing="4" text-anchor="middle">CERAMIC MUG • 350ML</text>
      
      <!-- Cyan Accent line -->
      <line x1="20" y1="72" x2="160" y2="72" stroke="#14f1d9" stroke-width="1.5"/>
    </g>

    <!-- Glossy Highlight Curve -->
    <path d="M 210 200 L 210 440" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.7"/>
    <path d="M 230 210 L 230 430" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>