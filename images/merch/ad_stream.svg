<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9146FF"/>
      <stop offset="50%" stop-color="#FF0000"/>
      <stop offset="100%" stop-color="#0abab5"/>
    </linearGradient>
    <filter id="streamGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#9146FF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="300" cy="300" r="190" fill="#9146FF" opacity="0.12"/>

  <g filter="url(#streamGlow)">
    <!-- Base Monitor -->
    <rect x="80" y="110" width="440" height="340" rx="28" fill="#090d16" stroke="#9146FF" stroke-width="2.5"/>

    <!-- Screen Bezel -->
    <rect x="95" y="125" width="410" height="310" rx="20" fill="#03060c"/>

    <!-- "LIVE" / "ON AIR" Pill Badge -->
    <rect x="120" y="150" width="100" height="30" rx="8" fill="#ef4444"/>
    <circle cx="138" cy="165" r="5" fill="#ffffff"/>
    <text x="175" y="171" font-family="'Orbitron', sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">LIVE</text>

    <!-- Platform Badges (Twitch, YouTube, TikTok) -->
    <rect x="360" y="150" width="125" height="30" rx="8" fill="#9146FF" opacity="0.2" stroke="#9146FF" stroke-width="1"/>
    <text x="422" y="170" font-family="'Orbitron', sans-serif" font-size="10" font-weight="900" fill="#c084fc" text-anchor="middle">STREAM PACK</text>

    <!-- Camera / Viewport graphic -->
    <g transform="translate(190, 205)">
      <!-- Video Cam -->
      <path d="M40 50 L140 50 L140 130 L40 130 Z" rx="10" fill="url(#streamGrad)"/>
      <polygon points="145,75 190,55 190,125 145,105" fill="#14f1d9"/>
      <!-- Lens -->
      <circle cx="90" cy="90" r="24" fill="#03060c" stroke="#ffffff" stroke-width="3"/>
      <circle cx="90" cy="90" r="10" fill="#14f1d9"/>
    </g>

    <!-- Text Specs below camera -->
    <text x="300" y="375" font-family="'Orbitron', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">ПРЯМІ ЕФІРИ • ПРАЙМ-ТАЙМ КАПТИ</text>
    <text x="300" y="405" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#0abab5" text-anchor="middle">Згадки стрімерами • Баннери на екрані • Команди в чаті</text>

    <!-- Stand -->
    <path d="M260 450 L340 450 L355 490 L245 490 Z" fill="#1e293b"/>
    <rect x="210" y="490" width="180" height="15" rx="6" fill="#334155"/>
  </g>
</svg>
