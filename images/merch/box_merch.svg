<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14f1d9"/>
      <stop offset="100%" stop-color="#0abab5"/>
    </linearGradient>
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#0abab5" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#boxShadow)" transform="translate(50, 40)">
    <!-- Isometric 3D Collector's Box -->
    <!-- Top Face -->
    <polygon points="250,80 430,150 250,220 70,150" fill="url(#boxTop)" stroke="#ffffff" stroke-width="2"/>
    <text x="250" y="160" font-family="'Orbitron', sans-serif" font-size="16" font-weight="900" fill="#020617" text-anchor="middle" transform="rotate(-15 250 160)">INQUISITORS</text>

    <!-- Left / Front Face -->
    <polygon points="70,150 250,220 250,450 70,380" fill="url(#boxFront)" stroke="#334155" stroke-width="2"/>
    
    <!-- Left Face Details -->
    <text x="160" y="290" font-family="'Orbitron', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" transform="skewY(20)">VIP DROP</text>
    <text x="160" y="320" font-family="'Orbitron', sans-serif" font-size="10" font-weight="700" fill="#0abab5" text-anchor="middle" transform="skewY(20)">LIMITED BOX [300 PCS]</text>
    <rect x="110" y="340" width="100" height="30" rx="4" fill="#0abab5" opacity="0.2" stroke="#0abab5" stroke-width="1.5" transform="skewY(20)"/>
    <text x="160" y="360" font-family="'Orbitron', sans-serif" font-size="9" font-weight="900" fill="#14f1d9" text-anchor="middle" transform="skewY(20)">COLLECTOR'S ED.</text>

    <!-- Right / Side Face -->
    <polygon points="250,220 430,150 430,380 250,450" fill="url(#boxSide)" stroke="#334155" stroke-width="2"/>
    
    <!-- Right Face Graphic -->
    <line x1="270" y1="260" x2="410" y2="200" stroke="#0abab5" stroke-width="2" stroke-dasharray="8,4"/>
    <line x1="270" y1="350" x2="410" y2="290" stroke="#0abab5" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="340" y="300" font-family="'Orbitron', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" transform="skewY(-20)">NG GTA 5 RP</text>
  </g>
</svg>