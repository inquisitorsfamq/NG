<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Tiffany Gradients -->
    <linearGradient id="tiffanyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14F1D9" />
      <stop offset="50%" stop-color="#0ABAB5" />
      <stop offset="100%" stop-color="#077A77" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0ABAB5" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="neonRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ABAB5" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#0ABAB5" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0ABAB5" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="250" cy="250" r="210" fill="url(#neonRadial)" />

  <!-- Outer Cyber Rings -->
  <circle cx="250" cy="250" r="225" fill="none" stroke="#0ABAB5" stroke-width="2" stroke-dasharray="14 8" opacity="0.4" />
  <circle cx="250" cy="250" r="205" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="40 10 10 10" opacity="0.6" />
  <circle cx="250" cy="250" r="185" fill="none" stroke="#0ABAB5" stroke-width="3" filter="url(#neonGlow)" />

  <!-- Geometric Diamond Accents -->
  <polygon points="250,15 260,35 250,55 240,35" fill="#14F1D9" filter="url(#neonGlow)" />
  <polygon points="250,485 260,465 250,445 240,465" fill="#14F1D9" filter="url(#neonGlow)" />
  <polygon points="15,250 35,260 55,250 35,240" fill="#14F1D9" filter="url(#neonGlow)" />
  <polygon points="485,250 465,260 445,250 465,240" fill="#14F1D9" filter="url(#neonGlow)" />

  <!-- Crossed Cyber Swords Background -->
  <g stroke="#0ABAB5" stroke-width="4" opacity="0.5" filter="url(#neonGlow)">
    <line x1="100" y1="100" x2="400" y2="400" stroke-linecap="round" />
    <line x1="400" y1="100" x2="100" y2="400" stroke-linecap="round" />
    <line x1="120" y1="90" x2="90" y2="120" stroke="#FFFFFF" stroke-width="6" />
    <line x1="380" y1="90" x2="410" y2="120" stroke="#FFFFFF" stroke-width="6" />
  </g>

  <!-- Winged Shield Shape -->
  <g filter="url(#neonGlow)">
    <!-- Wings left -->
    <path d="M140 190 Q90 220 70 300 Q120 280 150 240 Z" fill="#0ABAB5" opacity="0.7"/>
    <path d="M120 160 Q60 200 40 280 Q100 250 140 210 Z" fill="#14F1D9" opacity="0.5"/>
    
    <!-- Wings right -->
    <path d="M360 190 Q410 220 430 300 Q380 280 350 240 Z" fill="#0ABAB5" opacity="0.7"/>
    <path d="M380 160 Q440 200 460 280 Q400 250 360 210 Z" fill="#14F1D9" opacity="0.5"/>

    <!-- Central Gothic Shield -->
    <path d="M250 90 L340 145 V260 Q340 360 250 410 Q160 360 160 260 V145 Z" 
          fill="#070B0E" stroke="url(#tiffanyGrad)" stroke-width="5" />
    
    <!-- Inner Shield Inset -->
    <path d="M250 115 L320 160 V255 Q320 335 250 380 Q180 335 180 255 V160 Z" 
          fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4" />
  </g>

  <!-- Central Inquisitor Cross -->
  <g filter="url(#neonGlow)">
    <!-- Vertical beam -->
    <path d="M242 140 H258 V360 H242 Z" fill="url(#tiffanyGrad)" />
    <!-- Horizontal beam -->
    <path d="M200 200 H300 V216 H200 Z" fill="url(#tiffanyGrad)" />
    <!-- Diamond heart -->
    <polygon points="250,195 265,208 250,221 235,208" fill="#FFFFFF" />
  </g>

  <!-- Inscription Arc / Typography -->
  <path id="textArcTop" d="M 100,250 A 150,150 0 0,1 400,250" fill="none" />
  <text font-family="'Orbitron', sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="7" filter="url(#neonGlow)">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      INQUISITORS
    </textPath>
  </text>

  <!-- Subtitle Text -->
  <text x="250" y="325" font-family="'Orbitron', sans-serif" font-size="16" font-weight="900" fill="#14F1D9" text-anchor="middle" letter-spacing="5">
    FAMQ
  </text>

  <text x="250" y="348" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="4">
    NG PROJECT • GTA 5 RP
  </text>
</svg>
